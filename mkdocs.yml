site_name: QCLab
site_description: QCLab：量子化学の論文紹介と講義ノート（入門から最先端まで）
site_url: https://yugo0323.github.io/qc-notes/
repo_url: https://github.com/yugo0323/qc-notes
repo_name: yugo0323/qc-notes

theme:
  name: material
  language: ja
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え

plugins:
  - search:
      separator: '[\s\-\.、。（）「」]+'

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - ホーム: index.md
  - 論文紹介: papers/index.md
  - 講義ノート:
      - courses/index.md
      - 量子化学の理論: courses/qc-theory/index.md
      - 遷移金属錯体の計算: courses/tm-complexes/index.md
      - 機械学習の基礎:
          - courses/ml-basics/index.md
          - "第 1 回　機械学習とは：データから関数を作る": courses/ml-basics/01-what-is-ml.md
          - "第 2 回　線形回帰と最小二乗法": courses/ml-basics/02-linear-regression.md
          - "第 3 回　過学習と正則化、データの分け方": courses/ml-basics/03-overfitting-regularization.md
          - "第 4 回　カーネル法とガウス過程回帰": courses/ml-basics/04-kernel-gp.md
          - "第 5 回　ニューラルネットワークと誤差逆伝播": courses/ml-basics/05-neural-networks.md
      - 量子化学のための機械学習:
          - courses/ml-chem/index.md
          - "第 1 回　何を学習させるのか：エネルギー、力、性質": courses/ml-chem/01-what-to-learn.md
          - "第 2 回　分子の表し方：記述子と原子環境": courses/ml-chem/02-descriptors.md
          - "第 3 回　機械学習ポテンシャルの考え方：原子ごとのエネルギーの和": courses/ml-chem/03-mlip-basics.md
          - "第 4 回　初期の機械学習ポテンシャル：Behler–Parrinello、ANI、SchNet": courses/ml-chem/04-early-mlips.md
          - "第 5 回　等変ニューラルネットワークのポテンシャル：NequIP、MACE": courses/ml-chem/05-equivariant-mlips.md
      - 計算パッケージの使い方:
          - courses/packages/index.md
          - "第 1 回　計算の流れ：構造を作る、計算する、結果を読む": courses/packages/01-workflow.md
          - "第 2 回　分子構造の作り方と可視化": courses/packages/02-structures.md
          - "第 3 回　どのプログラムにも共通すること：電荷、スピン多重度、基底関数、計算方法": courses/packages/03-common-concepts.md
          - "第 4 回　Gaussian（1）：入力ファイルと構造最適化": courses/packages/04-gaussian-basics.md
          - "第 5 回　Gaussian（2）：振動解析、熱化学、溶媒効果": courses/packages/05-gaussian-freq-thermo.md
      - 研究の道具:
          - courses/tools/index.md
          - "第 1 回　Linux のコマンドライン": courses/tools/01-linux-command-line.md
          - "第 2 回　計算機クラスタでジョブを流す（一般的な考え方）": courses/tools/02-cluster-jobs.md
          - "第 3 回　Python と NumPy": courses/tools/03-python-numpy.md
          - "第 4 回　結果をグラフにする：Matplotlib": courses/tools/04-matplotlib.md
          - "第 5 回　Git と GitHub：変更の記録と共有": courses/tools/05-git-github.md
          - "第 6 回　Markdown と数式の書き方": courses/tools/06-markdown-math.md
  - 用語集: glossary.md
  - このサイトについて: about.md
