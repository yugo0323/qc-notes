          - "第 4 回　カーネル法とガウス過程回帰": courses/ml-basics/04-kernel-gp.md
          - "第 5 回　ニューラルネットワークと誤差逆伝播": courses/ml-basics/05-neural-networks.md
          - "第 6 回　最適化：確率的勾配降下法と Adam": courses/ml-basics/06-optimization.md
