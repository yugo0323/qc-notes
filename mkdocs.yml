site_name: QCLab
site_description: QCLab：量子化学の論文紹介と講義ノート（入門から最先端まで）
site_url: https://yugo0323.github.io/qc-notes/
repo_url: https://github.com/yugo0323/qc-notes
repo_name: yugo0323/qc-notes

theme:
  name: material
  custom_dir: overrides
  language: ja
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え

plugins:
  - search:
      separator: '[\s\-\.、。（）「」]+'

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css?v=20261119e

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/hero.js?v=20261119e
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - ホーム: index.md
  - 論文紹介: papers/index.md
  - 講義ノート:
      - courses/index.md
      - 量子化学の理論:
          - courses/qc-theory/index.md
          - "第 1 回　量子化学のための数学：行列、固有値問題、変分法": courses/qc-theory/01-mathematics.md
          - "第 2 回　多電子の波動関数：Born–Oppenheimer 近似と Slater 決定子": courses/qc-theory/02-many-electron-wavefunctions.md
          - "第 3 回　演算子と行列要素：Slater–Condon 則と第二量子化": courses/qc-theory/03-second-quantization.md
          - "第 4 回　スピン：Ŝ²、制限・非制限の決定子、CSF": courses/qc-theory/04-spin.md
          - "第 5 回　Hartree–Fock 法：RHF、UHF、ROHF": courses/qc-theory/05-hartree-fock.md
          - "第 6 回　基底関数": courses/qc-theory/06-basis-sets.md
          - "第 7 回　電子相関とは：動的相関と静的相関": courses/qc-theory/07-electron-correlation.md
          - "第 8 回　配置間相互作用（CI）": courses/qc-theory/08-configuration-interaction.md
          - "第 9 回　摂動論：MP2": courses/qc-theory/09-mp2.md
          - "第 10 回　結合クラスター法：CCSD(T)": courses/qc-theory/10-coupled-cluster.md
          - "第 11 回　局所相関法：DLPNO-CCSD(T)": courses/qc-theory/11-dlpno-ccsd-t.md
          - "第 12 回　多配置 SCF：CASSCF と活性空間の選び方": courses/qc-theory/12-casscf.md
          - "第 13 回　多参照摂動論：CASPT2 と NEVPT2": courses/qc-theory/13-caspt2-nevpt2.md
          - "第 14 回　大きな活性空間：DMRG と選択的 CI": courses/qc-theory/14-dmrg-sci.md
          - "第 15 回　Hohenberg–Kohn の定理と Kohn–Sham 法": courses/qc-theory/15-kohn-sham.md
          - "第 16 回　汎関数の階段：LDA、GGA、meta-GGA、混成、範囲分離": courses/qc-theory/16-functionals.md
          - "第 17 回　分散力の補正": courses/qc-theory/17-dispersion.md
          - "第 18 回　DFT の誤差：自己相互作用誤差と静的相関": courses/qc-theory/18-dft-errors.md
          - "第 19 回　線形応答と TDDFT": courses/qc-theory/19-tddft.md
          - "第 20 回　スピン反転 TDDFT": courses/qc-theory/20-spin-flip-tddft.md
          - "第 21 回　MRSF-TDDFT": courses/qc-theory/21-mrsf-tddft.md
          - "第 22 回　円錐交差と非断熱過程": courses/qc-theory/22-conical-intersections.md
          - "第 23 回　励起状態の波動関数法：EOM-CCSD、CC2、ADC(2)": courses/qc-theory/23-excited-wavefunction.md
      - 遷移金属錯体の計算:
          - courses/tm-complexes/index.md
          - "第 1 回　d 軌道と配位子場理論": courses/tm-complexes/01-ligand-field.md
          - "第 2 回　d 電子の数え方、酸化数、18 電子則": courses/tm-complexes/02-electron-counting.md
